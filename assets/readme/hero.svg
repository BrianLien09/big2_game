<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">CardDuel 即時多人紙牌對戰平台</title>
  <desc id="desc">CardDuel 的專案原生首頁視覺：四款紙牌模式、即時房間與牌桌流程。</desc>

  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#dc2626" opacity="0.22"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="414" rx="28" fill="#fffdf8" stroke="#0b0b0b" stroke-width="8"/>
  <rect x="928" y="8" width="264" height="180" rx="24" fill="url(#dots)"/>
  <path d="M48 386H676" stroke="#0b0b0b" stroke-width="3" stroke-dasharray="10 12" opacity="0.35"/>

  <g id="title-block" transform="translate(60 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#0b0b0b">
    <text x="0" y="0" font-size="20" font-weight="800" letter-spacing="3" fill="#dc2626">REALTIME CARD ROOMS</text>
    <text x="0" y="86" font-size="76" font-weight="900" letter-spacing="-3">Card<tspan fill="#dc2626">Duel</tspan></text>
    <text x="0" y="142" font-size="36" font-weight="800">和朋友開房，</text>
    <text x="0" y="184" font-size="36" font-weight="800">直接開打。</text>
    <text x="0" y="232" font-size="22" font-weight="600" fill="#4b4b4b">四款桌牌模式 · 真人 / Bot · 即時同步</text>

    <g transform="translate(0 264)">
      <rect x="0" y="0" width="136" height="42" rx="12" fill="#fbbf24" stroke="#0b0b0b" stroke-width="4"/>
      <text x="68" y="28" text-anchor="middle" font-size="18" font-weight="900">NEXT.JS</text>
      <rect x="150" y="0" width="142" height="42" rx="12" fill="#3b82f6" stroke="#0b0b0b" stroke-width="4"/>
      <text x="221" y="28" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">FIREBASE</text>
      <rect x="306" y="0" width="100" height="42" rx="12" fill="#fff" stroke="#0b0b0b" stroke-width="4"/>
      <text x="356" y="28" text-anchor="middle" font-size="18" font-weight="900">PWA</text>
    </g>
  </g>

  <g id="room-proof" transform="translate(720 54)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="0" y="0" width="416" height="254" rx="24" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="8"/>
    <text x="28" y="38" font-size="18" font-weight="800" letter-spacing="2" fill="#fbbf24">ROOM 0427</text>
    <circle cx="368" cy="29" r="7" fill="#dc2626"/>
    <text x="28" y="76" font-size="16" font-weight="700" fill="#fff" opacity="0.65">ACTIVE TABLE / 4 MODES</text>

    <g transform="translate(142 90)">
      <rect x="22" y="8" width="94" height="132" rx="12" fill="#3b82f6" stroke="#fff" stroke-width="4" transform="rotate(12 69 74)"/>
      <rect x="0" y="0" width="94" height="132" rx="12" fill="#fffdf8" stroke="#0b0b0b" stroke-width="5" transform="rotate(-8 47 66)"/>
      <text x="17" y="40" font-size="32" font-weight="900" fill="#dc2626" transform="rotate(-8 47 66)">K</text>
      <text x="21" y="82" font-size="38" font-weight="900" fill="#dc2626" transform="rotate(-8 47 66)">♥</text>
    </g>

    <g font-size="15" font-weight="900">
      <rect x="22" y="112" width="92" height="34" rx="10" fill="#fbbf24"/>
      <text x="68" y="135" text-anchor="middle">HOST</text>
      <rect x="302" y="112" width="92" height="34" rx="10" fill="#dc2626"/>
      <text x="348" y="135" text-anchor="middle" fill="#fff">BOT</text>
      <rect x="22" y="164" width="92" height="34" rx="10" fill="#fff"/>
      <text x="68" y="187" text-anchor="middle">YOU</text>
      <rect x="302" y="164" width="92" height="34" rx="10" fill="#3b82f6"/>
      <text x="348" y="187" text-anchor="middle" fill="#fff">DUO</text>
    </g>
  </g>

  <g id="flow" transform="translate(720 338)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#0b0b0b">
    <text x="0" y="0" fill="#dc2626">LOBBY</text>
    <text x="72" y="0">→</text>
    <text x="98" y="0" fill="#3b82f6">ROOM</text>
    <text x="174" y="0">→</text>
    <text x="200" y="0" fill="#b87e6b">MATCH</text>
    <text x="282" y="0">→</text>
    <text x="308" y="0" fill="#dc2626">SCORE</text>
  </g>
</svg>
